name: open-pr
# Opens a pull request for an already-pushed branch as the repository's
# automation identity, so the human owner is not its author and can approve it.
on:
  workflow_dispatch:
    inputs:
      head:
        required: true
        type: string
      base:
        required: true
        type: string
      title:
        required: true
        type: string
      body:
        required: true
        type: string
permissions:
  contents: read
  pull-requests: write
jobs:
  open:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ inputs.head }}
          BASE_BRANCH: ${{ inputs.base }}
          PR_TITLE: ${{ inputs.title }}
          PR_BODY: ${{ inputs.body }}
        run: gh pr create --head "$HEAD_BRANCH" --base "$BASE_BRANCH" --title "$PR_TITLE" --body "$PR_BODY"

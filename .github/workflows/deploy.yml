name: deploy
# Runs after a change lands on main. "production" records a deployment for the
# exact commit; "pages" publishes the release, with the commit id in the page,
# to the public site. No step reads pull-request or commit text.
on:
  push:
    branches: [main]
permissions:
  contents: read
  deployments: write
  pages: write
  id-token: write
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Exists only so the factory's rerun of a failed deployment can be observed.
      - name: simulated deploy hiccup (rerun proof)
        run: |
          if [ -f .deploy-flaky-once ] && [ "$GITHUB_RUN_ATTEMPT" = "1" ]; then
            echo "simulated deployment failure on the first attempt"
            exit 1
          fi
      - run: python check.py
  pages:
    needs: production
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the site
        run: |
          mkdir -p site
          python fizzbuzz.py > site/fizzbuzz.txt
          printf '<!doctype html><title>proving-ground-solo</title><p>commit <code>%s</code></p><p><a href="fizzbuzz.txt">fizzbuzz.txt</a></p>\n' "$GITHUB_SHA" > site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4

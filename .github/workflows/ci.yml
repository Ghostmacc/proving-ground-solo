name: ci
# Pull requests opened by the repository's automation do not start
# pull_request workflows, so the check also runs on pushes to ship/ branches.
# A check is matched by name on the commit, so either run satisfies the rule.
on:
  pull_request:
  push:
    branches: [main, "ship/**"]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python check.py
